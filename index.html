<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosta Motors — Showroom automobile à Mostaganem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#121110;--bg2:#1b1916;--line:#38332b;--tx:#f1ece3;--mute:#a79f90;--bz:#b8935a;--bz2:#d6b57c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:Tajawal,Archivo,Arial,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--bz2);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(18px,5vw,56px)}
header{position:sticky;top:0;z-index:20;background:rgba(18,17,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}
.logo img{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--bz);border-radius:50%;background:#eee;object-fit:cover}
.mm{width:38px;height:38px;border-radius:50%;background:#0a0a0a;border:2px solid var(--bz);display:grid;place-items:center;color:var(--bz2);font:800 14px/1 Archivo,sans-serif}
nav{display:flex;gap:26px;margin-inline-start:auto;font-size:14px;color:var(--mute)}
nav a:hover{color:var(--tx)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{all:unset;cursor:pointer;padding:4px 11px;border-radius:99px;font-size:13px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--bz);color:#16120b;font-weight:600}
.lang button:focus-visible{outline:2px solid var(--bz2)}
.hero{position:relative;min-height:calc(100svh - 68px);display:flex;align-items:flex-end;overflow:hidden;background:radial-gradient(120% 70% at 75% 85%,rgba(184,147,90,.28),transparent 60%),linear-gradient(180deg,#171512,#0d0c0b)}
.hero::before{content:"MM";position:absolute;inset-inline-end:-2%;top:6%;font:800 min(44vw,520px)/1 Archivo,sans-serif;color:transparent;-webkit-text-stroke:1px rgba(184,147,90,.22);pointer-events:none}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:34%;background:linear-gradient(0deg,#0a0a09,transparent)}
.hero .wrap{position:relative;z-index:2;padding-bottom:clamp(40px,8vh,90px);padding-top:80px}
h1{margin:0 0 18px;font:800 clamp(40px,8vw,104px)/.98 Archivo,sans-serif;font-stretch:112%;letter-spacing:-.025em;max-width:13ch}
html[lang=ar] h1{font-family:Tajawal,sans-serif;line-height:1.15;letter-spacing:0;max-width:16ch}
.sub{max-width:52ch;font-size:clamp(16px,1.7vw,20px);color:var(--mute);margin:0 0 30px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;border-radius:99px;font-weight:600;font-size:15px;border:1px solid var(--bz);transition:background .2s,color .2s}
.btn.p{background:var(--bz);color:#16120b}.btn.p:hover{background:var(--bz2)}
.btn.s{color:var(--bz2)}.btn.s:hover{background:rgba(184,147,90,.14)}
.search{margin-top:-34px;position:relative;z-index:5}
.sbox{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:16px}
.sbox label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.sbox select{width:100%;min-height:46px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit}
.sbox .btn{align-self:end}
section{padding:clamp(56px,9vw,110px) 0}
h2{margin:0 0 10px;font:700 clamp(28px,4.4vw,48px)/1.1 Archivo,sans-serif;font-stretch:108%;letter-spacing:-.015em}
html[lang=ar] h2{font-family:Tajawal,sans-serif;letter-spacing:0}
.note{color:var(--mute);font-size:14px;margin:0 0 34px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.car{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ph{aspect-ratio:16/10;display:grid;place-items:center;color:var(--mute);font-size:13px;background:repeating-linear-gradient(135deg,#1f1c18 0 14px,#24201b 14px 28px)}
.car div.i{padding:16px 18px 20px}
.car b{display:block;font-size:18px}.car span{color:var(--mute);font-size:14px}
.car .pr{margin-top:12px;color:var(--bz2);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{position:relative;min-height:340px;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:linear-gradient(0deg,rgba(10,10,9,.92),rgba(10,10,9,.2) 70%),linear-gradient(135deg,#2a241b,#14120f);transition:border-color .2s}
.tile:hover{border-color:var(--bz)}
.tile h3{margin:0 0 6px;font:700 24px/1.2 Archivo,sans-serif}
html[lang=ar] .tile h3{font-family:Tajawal,sans-serif}
.tile p{margin:0;color:var(--mute);font-size:15px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;border-top:1px solid var(--line);padding-top:36px}
.why h3{margin:0 0 6px;font-size:19px;color:var(--bz2)}.why p{margin:0;color:var(--mute)}
.contact{background:var(--bg2);border-block:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.tel{display:block;font:800 clamp(30px,5vw,52px)/1.1 Archivo,sans-serif;color:var(--bz2);margin:8px 0 22px;direction:ltr;unicode-bidi:isolate}
.map{min-height:260px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(0deg,rgba(18,17,16,.35),rgba(18,17,16,.35)),repeating-linear-gradient(60deg,#201d19 0 18px,#262219 18px 20px);display:grid;place-items:center;text-align:center;padding:24px}
.pin{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--bz);margin:0 auto 14px}
footer{padding:36px 0 96px;color:var(--mute);font-size:14px}
.fr{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center}
.soc{display:flex;gap:20px}.soc a:hover{color:var(--tx)}
.wa{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:#25a05a;color:#fff;border-radius:99px;min-height:52px;padding:0 22px;display:flex;align-items:center;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.45)}
@media(max-width:860px){nav{display:none}.lang{margin-inline-start:auto}.sbox{grid-template-columns:1fr 1fr}.sbox .btn{grid-column:1/-1}.tiles,.why,.cgrid{grid-template-columns:1fr}.tile{min-height:240px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://optfmocdhguhbbsxqfef.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_c2nYNV5WkJQeEmiVa8GL7g_fzJqFFdl';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=s=>document.querySelector(s), grid=$('#vehicleGrid'), statusBox=$('#vehicleStatus');let vehicles=[],editing=null,extraPhotos=[];
const words={fr:{empty:'Aucun véhicule annoncé pour le moment.',loading:'Chargement du stock…',error:'Impossible de charger le stock. Vérifie la configuration Supabase.',available:'Disponible',sold:'Vendu',km:'km',edit:'Modifier',soldAction:'Marquer vendu',saleAction:'Remettre en vente',remove:'Supprimer',noAdmin:'Ce compte n’a pas les droits administrateur.',saveError:'Enregistrement impossible : ',saved:'Véhicule enregistré.',deleted:'Annonce supprimée.',confirmDelete:'Supprimer cette annonce ?',photos:'Photos ajoutées au stockage.'},en:{empty:'No vehicles listed yet.',loading:'Loading inventory…',error:'Could not load inventory. Check the Supabase setup.',available:'Available',sold:'Sold',km:'km',edit:'Edit',soldAction:'Mark sold',saleAction:'Put back on sale',remove:'Delete',noAdmin:'This account does not have administrator access.',saveError:'Could not save: ',saved:'Vehicle saved.',deleted:'Listing deleted.',confirmDelete:'Delete this listing?',photos:'Photos uploaded.'},ar:{empty:'لا توجد مركبات معروضة حالياً.',loading:'جارٍ تحميل المخزون…',error:'تعذر تحميل المخزون. تحقق من إعداد Supabase.',available:'متوفرة',sold:'مباعة',km:'كم',edit:'تعديل',soldAction:'تحديد كمباعة',saleAction:'إعادة إلى البيع',remove:'حذف',noAdmin:'هذا الحساب لا يملك صلاحيات المسؤول.',saveError:'تعذر الحفظ: ',saved:'تم حفظ المركبة.',deleted:'تم حذف الإعلان.',confirmDelete:'حذف هذا الإعلان؟',photos:'تم رفع الصور.'}};
const tr=k=>(words[document.documentElement.lang]||words.fr)[k];
function safe(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function price(n){return Number(n||0).toLocaleString('fr-FR')+' DA'}
function updateBrandFilter(){const select=$('#f1'),old=select.value;select.innerHTML='<option value="">'+safe(T[document.documentElement.lang]?.all||'Tous')+'</option>'+[...new Set(vehicles.map(v=>v.brand).filter(Boolean))].sort().map(v=>`<option value="${safe(v)}">${safe(v)}</option>`).join('');select.value=old}
function filteredVehicles(){const brand=$('#f1').value,fuel=$('#f3').value,budget=Number($('#f2').value||0);return vehicles.filter(v=>(!brand||v.brand===brand)&&(!fuel||v.fuel===fuel)&&(!budget||Number(v.price_dzd)<=budget))}
function renderVehicles(){if(!grid)return;updateBrandFilter();const rows=filteredVehicles();grid.innerHTML=rows.map(v=>{const photos=Array.isArray(v.photo_urls)?v.photo_urls:[];const image=photos[0]?`<img src="${safe(photos[0])}" alt="${safe(v.brand)} ${safe(v.model)}" loading="lazy">`:`<div class="ph">Mosta Motors</div>`;return `<article class="car">${image}<div class="i"><b>${safe(v.brand)} · ${safe(v.model)} · ${safe(v.year)}</b><span>${Number(v.mileage_km||0).toLocaleString('fr-FR')} ${tr('km')} · ${safe(v.fuel||'')} · ${safe(v.gearbox||'')}</span><span>${safe(v.power||'')} · ${safe(v.color||'')}</span>${v.description?`<p>${safe(v.description)}</p>`:''}<div class="pr">${price(v.price_dzd)} <span class="sold-label">${v.available?tr('available'):tr('sold')}</span></div><button class="detail-trigger" type="button" data-detail="${safe(v.id)}">Voir l’annonce en détail ↗</button></div></article>`}).join('');grid.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>showVehicleDetail(b.dataset.detail));statusBox.textContent=rows.length?'':tr('empty')}
function showVehicleDetail(id){const v=vehicles.find(row=>row.id===id);if(!v)return;const photos=Array.isArray(v.photo_urls)?v.photo_urls:[];$('#detailContent').innerHTML=`<div class="detail-head"><div class="eyebrow">MOSTA MOTORS · ${safe(v.year)}</div><h2>${safe(v.brand)} ${safe(v.model)}</h2><div class="detail-price">${price(v.price_dzd)}</div></div><div class="detail-photos">${photos.length?photos.map((url,i)=>`<img src="${safe(url)}" alt="${safe(v.brand)} ${safe(v.model)} — photo ${i+1}" loading="lazy">`).join(''):'<div class="ph">Mosta Motors</div>'}</div><div class="detail-specs">${[['Année',v.year],['Kilométrage',Number(v.mileage_km||0).toLocaleString('fr-FR')+' km'],['Carburant',v.fuel],['Boîte',v.gearbox],['Puissance',v.power],['Couleur',v.color],['Disponibilité',v.available?'Disponible':'Vendu']].map(([label,value])=>`<div><small>${safe(label)}</small><b>${safe(value||'—')}</b></div>`).join('')}</div><p class="detail-description">${safe(v.description||'')}</p><div class="detail-contacts"><a href="tel:+213558567380">Appeler le 0558 56 73 80</a><a target="_blank" rel="noopener" href="https://wa.me/213558567380?text=${encodeURIComponent('Bonjour, je souhaite en savoir plus sur '+v.brand+' '+v.model+'.')}">Contacter sur WhatsApp ↗</a></div>`;$('#detailDialog').showModal()}
async function fetchVehicles(){statusBox.textContent=tr('loading');const {data,error}=await db.from('vehicles').select('*').order('created_at',{ascending:false});if(error){statusBox.textContent=tr('error');console.error(error);return}vehicles=data||[];renderVehicles()}
const dlg=$('#adminDialog'),loginForm=$('#loginForm'),dashboard=$('#adminDashboard'),message=$('#adminMessage'),form=$('#vehicleForm');
function adminMessage(text,isError=false){message.textContent=text;message.style.color=isError?'#ff9b8e':'var(--mute)'}
async function ensureAdmin(){const {data,error}=await db.rpc('is_mosta_admin');if(error||data!==true){await db.auth.signOut();loginForm.hidden=false;dashboard.hidden=true;adminMessage(tr('noAdmin'),true);return false}loginForm.hidden=true;dashboard.hidden=false;adminMessage('');await loadAdminList();return true}
async function loadAdminList(){const {data,error}=await db.from('vehicles').select('*').order('created_at',{ascending:false});if(error){adminMessage(tr('saveError')+error.message,true);return}vehicles=data||[];renderVehicles();$('#adminList').innerHTML=vehicles.length?vehicles.map(v=>`<div class="admin-row"><div><b>${safe(v.brand)} ${safe(v.model)} (${safe(v.year)})</b><br><small>${price(v.price_dzd)} · ${v.available?tr('available'):tr('sold')}</small></div><div><button type="button" data-edit="${safe(v.id)}">${tr('edit')}</button><button type="button" data-toggle="${safe(v.id)}">${v.available?tr('soldAction'):tr('saleAction')}</button><button type="button" data-delete="${safe(v.id)}">${tr('remove')}</button></div></div>`).join(''):'<p class="note">'+tr('empty')+'</p>';$('#adminList').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editVehicle(b.dataset.edit));$('#adminList').querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>toggleSold(b.dataset.toggle));$('#adminList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteVehicle(b.dataset.delete))}
$('#adminOpen').onclick=async e=>{e.preventDefault();dlg.showModal();const {data}=await db.auth.getSession();if(data.session)await ensureAdmin();else{loginForm.hidden=false;dashboard.hidden=true;adminMessage('Connectez-vous pour gérer les véhicules.')}};
$('#adminClose').onclick=()=>dlg.close();dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
const detailDlg=$('#detailDialog');$('#detailClose').onclick=()=>detailDlg.close();detailDlg.addEventListener('click',e=>{if(e.target===detailDlg)detailDlg.close()});
loginForm.onsubmit=async e=>{e.preventDefault();adminMessage('Connexion…');const {error}=await db.auth.signInWithPassword({email:$('#adminEmail').value,password:$('#adminPassword').value});if(error){adminMessage('Connexion refusée : '+error.message,true);return}await ensureAdmin()};
$('#signOut').onclick=async()=>{await db.auth.signOut();dashboard.hidden=true;loginForm.hidden=false;form.hidden=true;adminMessage('Déconnecté.')};
function resetVehicleForm(){editing=null;extraPhotos=[];form.reset();$('#vehicleId').value='';$('#vehicleFormTitle').textContent='Ajouter un véhicule';form.hidden=true}
$('#addVehicle').onclick=()=>{resetVehicleForm();form.hidden=false;form.scrollIntoView({behavior:'smooth',block:'center'})};$('#cancelVehicle').onclick=resetVehicleForm;
function editVehicle(id){const v=vehicles.find(x=>x.id===id);if(!v)return;editing=v;extraPhotos=Array.isArray(v.photo_urls)?[...v.photo_urls]:[];$('#vehicleId').value=v.id;$('#vBrand').value=v.brand||'';$('#vModel').value=v.model||'';$('#vYear').value=v.year||'';$('#vMileage').value=v.mileage_km||0;$('#vFuel').value=v.fuel||'Essence';$('#vTransmission').value=v.gearbox||'';$('#vPower').value=v.power||'';$('#vColor').value=v.color||'';$('#vPrice').value=v.price_dzd||'';$('#vAvailable').value=String(v.available);$('#vDescription').value=v.description||'';$('#vehicleFormTitle').textContent='Modifier '+v.brand+' '+v.model;form.hidden=false;form.scrollIntoView({behavior:'smooth',block:'center'})}
async function uploadPhotos(files){const urls=[];for(const file of files){if(!file.type.startsWith('image/'))throw new Error('Choisis uniquement des fichiers image.');if(file.size>8*1024*1024)throw new Error('Chaque photo doit faire moins de 8 Mo.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('vehicle-photos').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;urls.push(db.storage.from('vehicle-photos').getPublicUrl(path).data.publicUrl)}return urls}
form.onsubmit=async e=>{e.preventDefault();const submit=form.querySelector('[type=submit]');submit.disabled=true;adminMessage('Enregistrement…');try{const uploaded=await uploadPhotos($('#vPhotos').files);const payload={brand:$('#vBrand').value.trim(),model:$('#vModel').value.trim(),year:Number($('#vYear').value),mileage_km:Number($('#vMileage').value),fuel:$('#vFuel').value,gearbox:$('#vTransmission').value.trim(),power:$('#vPower').value.trim(),color:$('#vColor').value.trim(),price_dzd:Number($('#vPrice').value),description:$('#vDescription').value.trim(),available:$('#vAvailable').value==='true',photo_urls:[...extraPhotos,...uploaded]};let result;if(editing)result=await db.from('vehicles').update(payload).eq('id',editing.id);else result=await db.from('vehicles').insert(payload);if(result.error)throw result.error;adminMessage(tr('saved'));resetVehicleForm();await loadAdminList()}catch(err){adminMessage(tr('saveError')+(err.message||String(err)),true)}finally{submit.disabled=false}};
async function toggleSold(id){const v=vehicles.find(x=>x.id===id);if(!v)return;const {error}=await db.from('vehicles').update({available:!v.available}).eq('id',id);if(error){adminMessage(tr('saveError')+error.message,true);return}await loadAdminList()}
async function deleteVehicle(id){if(!confirm(tr('confirmDelete')))return;const {error}=await db.from('vehicles').delete().eq('id',id);if(error){adminMessage(tr('saveError')+error.message,true);return}adminMessage(tr('deleted'));await loadAdminList()}
$('#searchVehicles').onclick=renderVehicles;['#f1','#f2','#f3'].forEach(id=>$(id).addEventListener('change',renderVehicles));document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setTimeout(renderVehicles,0)));
fetchVehicles();
</script>
