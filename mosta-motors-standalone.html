<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mosta Motors — Showroom automobile à Mostaganem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#121110;--bg2:#1b1916;--line:#38332b;--tx:#f1ece3;--mute:#a79f90;--bz:#b8935a;--bz2:#d6b57c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.6 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:Tajawal,Archivo,Arial,sans-serif}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--bz2);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(18px,5vw,56px)}
header{position:sticky;top:0;z-index:20;background:rgba(18,17,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:68px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.02em}
.logo img{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--bz);border-radius:50%;background:#eee;object-fit:cover}
.mm{width:38px;height:38px;border-radius:50%;background:#0a0a0a;border:2px solid var(--bz);display:grid;place-items:center;color:var(--bz2);font:800 14px/1 Archivo,sans-serif}
nav{display:flex;gap:26px;margin-inline-start:auto;font-size:14px;color:var(--mute)}
nav a:hover{color:var(--tx)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{all:unset;cursor:pointer;padding:4px 11px;border-radius:99px;font-size:13px;color:var(--mute)}
.lang button[aria-pressed=true]{background:var(--bz);color:#16120b;font-weight:600}
.lang button:focus-visible{outline:2px solid var(--bz2)}
.hero{position:relative;min-height:calc(100svh - 68px);display:flex;align-items:flex-end;overflow:hidden;background:radial-gradient(120% 70% at 75% 85%,rgba(184,147,90,.28),transparent 60%),linear-gradient(180deg,#171512,#0d0c0b)}
.hero::before{content:"MM";position:absolute;inset-inline-end:-2%;top:6%;font:800 min(44vw,520px)/1 Archivo,sans-serif;color:transparent;-webkit-text-stroke:1px rgba(184,147,90,.22);pointer-events:none}
.hero::after{content:"";position:absolute;inset-inline:0;bottom:0;height:34%;background:linear-gradient(0deg,#0a0a09,transparent)}
.hero .wrap{position:relative;z-index:2;padding-bottom:clamp(40px,8vh,90px);padding-top:80px}
h1{margin:0 0 18px;font:800 clamp(40px,8vw,104px)/.98 Archivo,sans-serif;font-stretch:112%;letter-spacing:-.025em;max-width:13ch}
html[lang=ar] h1{font-family:Tajawal,sans-serif;line-height:1.15;letter-spacing:0;max-width:16ch}
.sub{max-width:52ch;font-size:clamp(16px,1.7vw,20px);color:var(--mute);margin:0 0 30px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 28px;border-radius:99px;font-weight:600;font-size:15px;border:1px solid var(--bz);transition:background .2s,color .2s}
.btn.p{background:var(--bz);color:#16120b}.btn.p:hover{background:var(--bz2)}
.btn.s{color:var(--bz2)}.btn.s:hover{background:rgba(184,147,90,.14)}
.search{margin-top:-34px;position:relative;z-index:5}
.sbox{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:16px}
.sbox label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.sbox select{width:100%;min-height:46px;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit}
.sbox .btn{align-self:end}
section{padding:clamp(56px,9vw,110px) 0}
h2{margin:0 0 10px;font:700 clamp(28px,4.4vw,48px)/1.1 Archivo,sans-serif;font-stretch:108%;letter-spacing:-.015em}
html[lang=ar] h2{font-family:Tajawal,sans-serif;letter-spacing:0}
.note{color:var(--mute);font-size:14px;margin:0 0 34px}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.car{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ph{aspect-ratio:16/10;display:grid;place-items:center;color:var(--mute);font-size:13px;background:repeating-linear-gradient(135deg,#1f1c18 0 14px,#24201b 14px 28px)}
.car div.i{padding:16px 18px 20px}
.car b{display:block;font-size:18px}.car span{color:var(--mute);font-size:14px}
.car .pr{margin-top:12px;color:var(--bz2);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.tile{position:relative;min-height:340px;border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:linear-gradient(0deg,rgba(10,10,9,.92),rgba(10,10,9,.2) 70%),linear-gradient(135deg,#2a241b,#14120f);transition:border-color .2s}
.tile:hover{border-color:var(--bz)}
.tile h3{margin:0 0 6px;font:700 24px/1.2 Archivo,sans-serif}
html[lang=ar] .tile h3{font-family:Tajawal,sans-serif}
.tile p{margin:0;color:var(--mute);font-size:15px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;border-top:1px solid var(--line);padding-top:36px}
.why h3{margin:0 0 6px;font-size:19px;color:var(--bz2)}.why p{margin:0;color:var(--mute)}
.contact{background:var(--bg2);border-block:1px solid var(--line)}
.cgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center}
.tel{display:block;font:800 clamp(30px,5vw,52px)/1.1 Archivo,sans-serif;color:var(--bz2);margin:8px 0 22px;direction:ltr;unicode-bidi:isolate}
.map{min-height:260px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(0deg,rgba(18,17,16,.35),rgba(18,17,16,.35)),repeating-linear-gradient(60deg,#201d19 0 18px,#262219 18px 20px);display:grid;place-items:center;text-align:center;padding:24px}
.pin{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--bz);margin:0 auto 14px}
footer{padding:36px 0 96px;color:var(--mute);font-size:14px}
.fr{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;align-items:center}
.soc{display:flex;gap:20px}.soc a:hover{color:var(--tx)}
.wa{position:fixed;inset-inline-end:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:#25a05a;color:#fff;border-radius:99px;min-height:52px;padding:0 22px;display:flex;align-items:center;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.45)}
@media(max-width:860px){nav{display:none}.lang{margin-inline-start:auto}.sbox{grid-template-columns:1fr 1fr}.sbox .btn{grid-column:1/-1}.tiles,.why,.cgrid{grid-template-columns:1fr}.tile{min-height:240px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
